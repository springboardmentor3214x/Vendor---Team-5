    <ul class="menu">
      <li routerLink="/dashboard" routerLinkActive="active">
        <i class="ti ti-home"></i> Dashboard

      <li class="menu-title">Management</li>

      <li routerLink="/user-management" routerLinkActive="active">
        <i class="ti ti-users"></i> User Management

      <li routerLink="/vendor-management" routerLinkActive="active">
