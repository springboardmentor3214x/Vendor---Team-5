<div class="forgot-password-container">
  <div class="card">
    <div class="header">
      Forgot Password
    </div>

    <p class="description">
      Enter the email address linked to your account and we'll send
      you a link to reset your password.
    </p>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <label for="email">Enter your registered mail</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="Enter Email Address"
        class="email-input"
      />

      <div *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid" class="error-text">
        <span *ngIf="forgotForm.get('email')?.errors?.['required']">Email is required.</span>
        <span *ngIf="forgotForm.get('email')?.errors?.['email']">Enter a valid email address.</span>
      </div>

      <div *ngIf="errorMessage" class="error-text">
        {{ errorMessage }}
      </div>

      <div *ngIf="isSubmitted" class="success-text">
        A reset link has been sent to your email.
      </div>

      <button
        type="submit"
        class="submit-button"
        [disabled]="forgotForm.invalid || isSubmitting"
      >
        {{ isSubmitting ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </form>

    <p class="footer-links">
      Remembered your password?
      <a routerLink="/login">Login</a>
    </p>

    <p class="footer-links">
      Already have a reset link?
      <a routerLink="/reset-password">Reset Password</a>
    </p>
  </div>
</div>
