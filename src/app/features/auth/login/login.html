<div class="login-page">

  <!-- LEFT IMAGE PANEL -->
  <div class="left-panel">
    <img src="https://img.etimg.com/thumb/width-640,height-480,imgsize-32412,resizemode-75,msid-115444814/news/economy/indicators/india-to-contribute-20-pc-of-global-workforce-growth-between-2023-2050-china-share-to-decline-report/singapore-job-security.jpg"
    class="left-panel-image"/>
    <div class="brand-overlay">VendorIQ</div>
  </div>

  <!-- RIGHT LOGIN FORM PANEL -->
  <div class="right-panel">
    <div class="form-wrap">
      <div class="logo-row">
        <img src="https://cdn.vectorstock.com/i/500p/11/31/scratched-vendor-stamp-seal-vector-23351131.jpg " alt="VENDOR LOGO" class="logo-badge" />
          <h1 class="title">Vendor Reliability Intelligence Platform</h1>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

        <!-- EMAIL -->
        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <input
              type="email"
              id="email"
              formControlName="email"
              placeholder="Enter Email"
            />
          </div>
          <span class="error-text" *ngIf="email?.invalid && email?.touched">
            Please enter a valid email address.
          </span>
        </div>

        <!-- PASSWORD WITH SHOW/HIDE -->
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input
              [type]="isPasswordVisible ? 'text' : 'password'"
              id="password"
              formControlName="password"
              placeholder="Enter Password"
            />
            <button
              type="button"
              class="toggle-visibility"
              (click)="togglePasswordVisibility()"
              [attr.aria-pressed]="isPasswordVisible"
              [attr.aria-label]="isPasswordVisible ? 'Hide password' : 'Show password'"
            >
              <svg *ngIf="!isPasswordVisible" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="isPasswordVisible" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.7 19.7 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a19.9 19.9 0 0 1-3.22 4.44"/>
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <span class="error-text" *ngIf="password?.invalid && password?.touched">
            Password must be at least 6 characters.
          </span>
        </div>

        <!-- ROLE SELECT (custom dropdown) -->
        <div class="field">
          <label>Select Role</label>
          <div class="role-select-header" (click)="toggleRoleDropdown()">
            <span class="label-text">{{ selectedRole || 'Choose your role' }}</span>
            <svg
              class="chevron"
              [class.open]="isRoleDropdownOpen"
              width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            >
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <div class="role-options" [class.open]="isRoleDropdownOpen">
            <div
              class="role-option"
              *ngFor="let role of roles"
              [class.selected]="selectedRole === role"
              (click)="selectRole(role)"
            >
              {{ role }}
            </div>
          </div>
        </div>

        <!-- REMEMBER + FORGOT -->
        <div class="remember-row">
          <div class="remember-check">
            <input type="checkbox" id="rememberMe" formControlName="rememberMe" />
            <label for="rememberMe">Readme</label>
          </div>
          <a routerLink="/forgot-password" class="forgot-link">forgot password?</a>
        </div>

        <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <!-- LOGIN BUTTON -->
        <button type="submit" class="login-btn" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Logging in...' : 'Login' }}
        </button>

        <p class="register-row">
          Don't have an account? <a routerLink="/register">Register</a>
        </p>

      </form>
    </div>
  </div>

</div>
