<div class="reset-password-container">
  <div class="card">
    <div class="header">
      Reset Password
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <label for="newPassword">New Password</label>
      <div class="password-field">
        <input
          id="newPassword"
          [type]="showNewPassword ? 'text' : 'password'"
          formControlName="newPassword"
          class="password-input"
        />
        <span class="eye-icon" (click)="toggleNewPassword()">👁</span>
      </div>
      <div *ngIf="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.invalid" class="error-text">
        <span *ngIf="resetForm.get('newPassword')?.errors?.['required']">New password is required.</span>
        <span *ngIf="resetForm.get('newPassword')?.errors?.['minlength']">Password must be at least 8 characters.</span>
      </div>

      <label for="confirmPassword">Confirm Password</label>
      <div class="password-field">
        <input
          id="confirmPassword"
          [type]="showConfirmPassword ? 'text' : 'password'"
          formControlName="confirmPassword"
          class="password-input"
        />
        <span class="eye-icon" (click)="toggleConfirmPassword()">👁</span>
      </div>
      <div *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.errors?.['passwordMismatch']" class="error-text">
        Passwords do not match.
      </div>

      <div *ngIf="errorMessage" class="error-text">
        {{ errorMessage }}
      </div>

      <div *ngIf="isSubmitted" class="success-text">
        Your password has been reset successfully.
      </div>

      <button
        type="submit"
        class="submit-button"
        [disabled]="resetForm.invalid || isSubmitting"
      >
        {{ isSubmitting ? 'Saving...' : 'Save Password' }}
      </button>
    </form>

    <p class="footer-links">
      <a routerLink="/login">Back to Login</a>
    </p>
  </div>
</div>
