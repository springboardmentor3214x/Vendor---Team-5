<div class="page">

  <div class="header">
    <h2>Procurement Management</h2>
    <p>Dashboard > Create Purchase Order</p>
    <small>Here's what's happening with your platform today</small>
  </div>

  <div class="card">

    <h3>Create Purchase Order</h3>

    <div class="form-grid">

      <div class="form-group">
        <label>Vendor Name</label>
        <select [(ngModel)]="vendorName">
          <option value="">Select Vendor</option>
          <option>Tech Solutions Pvt Ltd</option>
          <option>ABC Traders</option>
          <option>Global Supplies</option>
        </select>
      </div>

      <div class="form-group">
        <label>PO Date</label>
        <input
          type="date"
          [(ngModel)]="poDate">
      </div>

      <div class="form-group">
        <label>Required Delivery Date</label>
        <input
          type="date"
          [(ngModel)]="deliveryDate">
      </div>

      <div class="form-group">
        <label>Contact Person</label>
        <input
          type="text"
          placeholder="Enter contact person"
          [(ngModel)]="contactPerson">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          placeholder="Enter email"
          [(ngModel)]="email">
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input
          type="text"
          placeholder="Enter phone number"
          [(ngModel)]="phone">
      </div>

    </div>

    <h3 class="item-title">Item Details</h3>

    <table class="item-table">

      <thead>
        <tr>
          <th>Item Name</th>
          <th>Description</th>
          <th>Quantity</th>
          <th>Unit Price</th>
          <th>Total</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let item of items; let i=index">

          <td>
            <input
              type="text"
              placeholder="Enter item name"
              [(ngModel)]="item.itemName">
          </td>

          <td>
            <input
              type="text"
              placeholder="Enter description"
              [(ngModel)]="item.description">
          </td>

          <td>
            <input
              type="number"
              [(ngModel)]="item.quantity"
              (input)="calculateTotal(i)">
          </td>

          <td>
            <input
              type="number"
              [(ngModel)]="item.unitPrice"
              (input)="calculateTotal(i)">
          </td>

          <td>
            ₹{{item.total}}
          </td>

        </tr>

      </tbody>

    </table>

    <div class="buttons">

      <button
        class="add-btn"
        (click)="addItem()">
        + Add Item
      </button>

      <button
        class="save-btn"
        (click)="savePO()">
        Save
      </button>

      <button
        class="cancel-btn"
        (click)="cancel()">
        Cancel
      </button>

    </div>

  </div>

</div>
