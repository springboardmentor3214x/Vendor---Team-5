<div class="dashboard">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="logo">
      <img src="https://cdn.vectorstock.com/i/500p/11/31/scratched-vendor-stamp-seal-vector-23351131.jpg" alt="Logo">
    </div>

    <h3>
      Vendor Management
    </h3>

    <ul class="menu">
    <li routerLink="/vendor-list"><i class="ti ti-list"></i>Vendor List</li>
    <li routerLink="/add-vendor"><i class="ti ti-user-plus"></i>Add Vendor</li>
    <li routerLink="/vendor-document"><i class="ti ti-file-description"></i>Vendor Document</li>
    <li  class="action" routerLink="/vendor-details"><i class="ti ti-id"></i>Vendor Details</li>
    <li routerLink="/edit-vendor"><i class="ti ti-edit"></i>Edit Vendor</li>
    <li routerLink="/vendor-approval"><i class="ti ti-check"></i>Vendor Approval</li>
    <li routerLink="/vendor-status"><i class="ti ti-chart-bar"></i>Vendor Status</li>
  </ul>
   
  </aside>

  <!-- Main Content -->
  <section class="content">

    <!-- Header -->
    <div class="topbar">

      <div>

        <h2>Edit Vendor</h2>

        <small>Dashboard / Vendor Management / Edit Vendor</small>

      </div>

      <div class="search">

        <input
          type="text"
          placeholder="Search anything">

      </div>

     

    </div>

    <!-- Form -->
    <form class="vendor-form">

      <div class="form-group">

        <label>Company Name *</label>

        <input
          type="text"
          [(ngModel)]="vendor.companyName"
          name="companyName">

      </div>

      <div class="form-group">

        <label>Vendor Category *</label>

        <input
          type="text"
          [(ngModel)]="vendor.category"
          name="category">

      </div>

      <div class="form-group">

        <label>Contact Person Name *</label>

        <input
          type="text"
          [(ngModel)]="vendor.contactPerson"
          name="contactPerson">

      </div>

      <div class="form-group">

        <label>Destination *</label>

        <input
          type="text"
          [(ngModel)]="vendor.destination"
          name="destination">

      </div>

      <div class="form-group">

        <label>Email Address *</label>

        <input
          type="email"
          [(ngModel)]="vendor.email"
          name="email">

      </div>

      <div class="form-group">

        <label>Phone Number *</label>

        <input
          type="text"
          [(ngModel)]="vendor.phone"
          name="phone">

      </div>

      <div class="form-group">

        <label>Alternate Phone *</label>

        <input
          type="text"
          [(ngModel)]="vendor.altPhone"
          name="altPhone">

      </div>

      <div class="form-group">

        <label>GST Number *</label>

        <input
          type="text"
          [(ngModel)]="vendor.gst"
          name="gst">

      </div>

      <div class="form-group">

        <label>PAN Number *</label>

        <input
          type="text"
          [(ngModel)]="vendor.pan"
          name="pan">

      </div>

      <div class="form-group">

        <label>Company Registration Number *</label>

        <input
          type="text"
          [(ngModel)]="vendor.registration"
          name="registration">

      </div>

      <div class="form-group">

        <label>Address Line 1 *</label>

        <input
          type="text"
          [(ngModel)]="vendor.address1"
          name="address1">

      </div>

      <div class="form-group">

        <label>Address Line 2 *</label>

        <input
          type="text"
          [(ngModel)]="vendor.address2"
          name="address2">

      </div>

      <div class="form-group">

        <label>City *</label>

        <input
          type="text"
          [(ngModel)]="vendor.city"
          name="city">

      </div>

      <div class="form-group">

        <label>State *</label>

        <input
          type="text"
          [(ngModel)]="vendor.state"
          name="state">

      </div>

      <div class="form-group">

        <label>Country *</label>

        <input
          type="text"
          [(ngModel)]="vendor.country"
          name="country">

      </div>

      <div class="form-group">

        <label>Pincode *</label>

        <input
          type="text"
          [(ngModel)]="vendor.pincode"
          name="pincode">

      </div>

      <div class="form-group">

        <label>Website *</label>

        <input
          type="text"
          [(ngModel)]="vendor.website"
          name="website">

      </div>

      <div class="form-group">

        <label>Description *</label>

        <input
          type="text"
          [(ngModel)]="vendor.description"
          name="description">

      </div>

      <div class="form-group">

        <label>Bank Account Number *</label>

        <input
          type="text"
          [(ngModel)]="vendor.bankAccount"
          name="bankAccount">

      </div>

      <div class="form-group">

        <label>IFSC Code *</label>

        <input
          type="text"
          [(ngModel)]="vendor.ifsc"
          name="ifsc">

      </div>

      <div class="form-group">

        <label>Payment Terms *</label>

        <input
          type="text"
          [(ngModel)]="vendor.paymentTerms"
          name="paymentTerms">

      </div>

      <div class="form-group">

        <label>Status *</label>

        <select
          [(ngModel)]="vendor.status"
          name="status">

          <option>Active</option>
          <option>Inactive</option>

        </select>

      </div>

    </form>

    <div class="buttons">

      <button
        class="save-btn"
        (click)="saveVendor()">
        Save
      </button>

      <button
        class="edit-btn"
        (click)="updateVendor()">
        Edit
      </button>

    </div>

  </section>

</div>
