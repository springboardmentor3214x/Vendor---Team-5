<div class="orders-container">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="logo">
      <img src="https://cdn.vectorstock.com/i/500p/11/31/scratched-vendor-stamp-seal-vector-23351131.jpg" alt="Vendor">
    </div>

    <ul class="menu">

      <li routerLink="/vendor">
        <i class="ti ti-home"></i>
        <span>Dashboard</span>
      </li>

      <li routerLink="/vendor-profile">
        <i class="ti ti-users"></i>
        <span>Vendor Profile</span>
      </li>

      <li class="active">
        <i class="ti ti-shopping-cart"></i>
        <span>Orders</span>
      </li>

      <li routerLink="/contracts">
        <i class="ti ti-file-text"></i>
        <span>Contracts</span>
      </li>

      <li routerLink="/communication">
        <i class="ti ti-message-circle"></i>
        <span>Communication</span>
      </li>

    </ul>

  </aside>

  <!-- Main -->
  <main class="main-content">

    <!-- Header -->
    <header class="topbar">

      <div class="left">
        <i class="ti ti-menu-2"></i>
        <h2>Orders</h2>
      </div>

      
    </header>

    <!-- Tabs -->

    <div class="tabs">

      <button class="active">All Orders</button>
      <button>In Progress</button>
      <button>Pending</button>
      <button>Completed</button>
      <button>Cancelled</button>

    </div>

    <!-- Search -->

    <div class="search-box">

      <i class="ti ti-search"></i>

      <input
        type="text"
        placeholder="Search orders..."
      >

    </div>

    <!-- Orders Table -->

    <div class="table-card">

      <table>

        <thead>

          <tr>

            <th>Order ID</th>
            <th>Project</th>
            <th>Status</th>
            <th>Order Date</th>
            <th>Delivery Date</th>
            <th>Amount</th>

          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let order of orders">

            <td>{{order.id}}</td>

            <td>{{order.project}}</td>

            <td>

              <span
                [ngClass]="{
                'progress': order.status==='In Progress',
                'pending': order.status==='Pending',
                'completed': order.status==='Completed',
                'cancelled': order.status==='Cancelled'
              }">

                {{order.status}}

              </span>

            </td>

            <td>{{order.orderDate}}</td>

            <td>{{order.deliveryDate}}</td>

            <td>{{order.amount}}</td>

          </tr>

        </tbody>

      </table>

    </div>

  </main>

</div>
