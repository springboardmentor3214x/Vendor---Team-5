<header class="topbar">
  <div class="left">
    <i class="ti ti-menu-2"></i>
    <div>
      <h2>Add Vendor</h2>
      <p class="breadcrumb">Vendor management/Edit vendor</p>
    </div>
  </div>
    <ul class="menu">
      <li routerLink="add-vendor" >
        <i class="ti ti-user"></i> add vendor
      </li>

      <li routerLink="edit-vendor" >
        <i class="ti ti-edit"></i> edit vendor
      </li>

      <li routerLink="vendor-list" >
        <i class="ti ti-building-store"></i> Vendor list
      </li>

      <li routerLink="view-vendor">
        <i class="ti ti-eye"></i> view vendor
      </li>
    </ul>

  <div class="search-box">
    <input type="text" placeholder="Search anything">
    <i class="ti ti-search"></i>
  </div>

  <div class="right">
    <i class="ti ti-bell"></i>
    <i class="ti ti-user-circle"></i>
    <span class="username">Administrator</span>
  </div>
</header>

<form class="vendor-form" [formGroup]="vendorForm" (ngSubmit)="onSave()">

  <div class="form-grid">

    <div class="form-group">
      <label>Vendor name <span class="required">*</span></label>
      <input type="text" formControlName="vendorName" placeholder="Enter Vendor name">
      <div class="error-text" *ngIf="vendorForm.get('vendorName')?.touched && vendorForm.get('vendorName')?.invalid">
        Vendor name is required.
      </div>
    </div>

    <div class="form-group">
      <label>Email <span class="required">*</span></label>
      <input type="email" formControlName="email" placeholder="Enter Email">
      <div class="error-text" *ngIf="vendorForm.get('email')?.touched && vendorForm.get('email')?.invalid">
        Enter a valid email.
      </div>
    </div>

    <div class="form-group">
      <label>Phone <span class="required">*</span></label>
      <input type="tel" formControlName="phone" placeholder="Enter Phone Number">
      <div class="error-text" *ngIf="vendorForm.get('phone')?.touched && vendorForm.get('phone')?.invalid">
        Phone number is required.
      </div>
    </div>

    <div class="form-group">
      <label>Address <span class="required">*</span></label>
      <input type="text" formControlName="address" placeholder="Enter Address">
      <div class="error-text" *ngIf="vendorForm.get('address')?.touched && vendorForm.get('address')?.invalid">
        Address is required.
      </div>
    </div>

    <div class="form-group">
      <label>GST Number <span class="required">*</span></label>
      <input type="text" formControlName="gstNumber" placeholder="Enter GST Number">
      <div class="error-text" *ngIf="vendorForm.get('gstNumber')?.touched && vendorForm.get('gstNumber')?.invalid">
        GST Number is required.
      </div>
    </div>

    <div class="form-group">
      <label>Contact Number <span class="required">*</span></label>
      <input type="tel" formControlName="contactNumber" placeholder="Enter Contact Number">
      <div class="error-text" *ngIf="vendorForm.get('contactNumber')?.touched && vendorForm.get('contactNumber')?.invalid">
        Contact number is required.
      </div>
    </div>

    <div class="form-group">
      <label>Company <span class="required">*</span></label>
      <select formControlName="company">
        <option value="" disabled selected>Select Category</option>
        <option value="IT Vendors">IT Vendors</option>
        <option value="Raw Material Suppliers">Raw Material Suppliers</option>
        <option value="Equipment Vendors">Equipment Vendors</option>
        <option value="Procurement">Procurement</option>
      </select>
      <div class="error-text" *ngIf="vendorForm.get('company')?.touched && vendorForm.get('company')?.invalid">
        Please select a company category.
      </div>
    </div>

    <div class="form-group">
      <label>Registration date</label>
      <div class="date-field">
        <input type="date" formControlName="registrationDate">
        <i class="ti ti-calendar"></i>
      </div>
    </div>

    <div class="form-group">
      <label>Status</label>
      <select formControlName="status">
        <option value="" disabled selected>Select Status</option>
        <option value="Active">Active</option>
        <option value="Pending">Pending</option>
        <option value="Inactive">Inactive</option>
        <option value="Rejected">Rejected</option>
      </select>
    </div>

  </div>

  <div class="form-actions">
    <button type="button" class="cancel-btn" (click)="onCancel()">Cancel</button>
    <button type="submit" class="save-btn" [disabled]="isSaving">
      {{ isSaving ? 'Saving...' : 'Save' }}
    </button>
  </div>

</form>
