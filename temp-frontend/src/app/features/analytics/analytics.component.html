<section class="page-card">
  <h2 class="mb-3">Analytics</h2>
  <div class="row g-3">
    <div class="col-md-4" *ngFor="let metric of metrics">
      <div class="metric-card">
        <small class="text-muted">{{ metric.title }}</small>
        <strong class="d-block fs-4">{{ metric.value }}</strong>
      </div>
    </div>
  </div>
</section>
