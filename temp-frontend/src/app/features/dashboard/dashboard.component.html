<section class="page-card">
  <div class="page-header d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div>
      <h2 class="mb-1">{{ view.title }}</h2>
      <p class="mb-0 text-muted">{{ view.description }}</p>
    </div>
    <a class="btn btn-primary" [routerLink]="view.primaryAction.path">{{ view.primaryAction.label }}</a>
  </div>

  <div class="row g-3">
    <div class="col-md-6 col-xl-4" *ngFor="let card of view.cards">
      <div class="stat-card" [class]="'stat-card tone-' + card.tone">
        <span class="stat-label">{{ card.title }}</span>
        <p class="stat-description">{{ card.description }}</p>
        <a class="btn btn-outline-primary btn-sm align-self-start" [routerLink]="card.path">{{ card.actionLabel }}</a>
      </div>
    </div>
  </div>

  <div class="panel mt-4">
    <h4 class="panel-title">Operational highlights</h4>
    <ul class="highlights-list mb-0">
      <li *ngFor="let item of view.highlights">{{ item }}</li>
    </ul>
  </div>
</section>
