<section class="page-card">
  <div class="page-header d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-1">Dashboard</h2>
      <p class="mb-0 text-muted">An overview of the core vendor reliability controls.</p>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-6 col-xl-3" *ngFor="let card of overviewCards">
      <div class="stat-card">
        <span class="stat-label">{{ card.title }}</span>
        <strong class="stat-value">{{ card.value }}</strong>
      </div>
    </div>
  </div>

  <div class="panel mt-4">
    <h4 class="panel-title">Operational highlights</h4>
    <ul class="highlights-list mb-0">
      <li *ngFor="let item of highlights">{{ item }}</li>
    </ul>
  </div>
</section>
