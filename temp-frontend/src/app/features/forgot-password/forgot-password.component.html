<section class="auth-shell">
  <div class="auth-card">
    <div class="text-center mb-4">
      <span class="auth-logo">VR</span>
      <h2>Forgot password</h2>
      <p>Enter your email and we will send you a password reset link.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate [attr.aria-busy]="isSubmitting()">
      <div class="mb-3">
        <label class="form-label">Email<span class="required-mark" aria-hidden="true">*</span></label>
        <input class="form-control" type="email" formControlName="email" autocomplete="email" [disabled]="isSubmitting()" />
        <div class="field-error" *ngIf="control('email')?.touched && control('email')?.invalid">
          Enter a valid email address.
        </div>
      </div>

      <div class="alert alert-danger" *ngIf="errorMessage()">
        {{ errorMessage() }}
      </div>

      <div class="alert alert-success" *ngIf="successMessage()">
        {{ successMessage() }}
      </div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Submitting...' : 'Send reset request' }}
      </button>
    </form>

    <div class="mt-3 text-center">
      <a routerLink="/login">Back to login</a>
    </div>
  </div>
</section>
