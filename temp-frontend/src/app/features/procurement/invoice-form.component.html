<section class="form-page"><header><p class="eyebrow">Procurement finance</p><h2>Create invoice</h2><p>Fields marked <span class="required">*</span> are required. This form sends data only; it does not upload files.</p></header><div *ngIf="errorMessage()" class="message error" role="alert">{{ errorMessage() }}</div><form [formGroup]="form" (ngSubmit)="submit()" novalidate><section class="form-card"><h3>Invoice details</h3><div class="form-grid"><label>Purchase order ID <span class="required">*</span><input type="number" min="1" formControlName="purchaseOrderId"><small *ngIf="hasError('purchaseOrderId','required')">Enter a purchase order ID.</small><small class="help">Use Create invoice from a purchase order to prefill this ID automatically.</small></label><label>Invoice number <span class="required">*</span><input formControlName="invoiceNumber" maxlength="255"><small *ngIf="hasError('invoiceNumber','required') || hasError('invoiceNumber','minlength')">Use at least 2 characters.</small></label><label>Invoice amount <span class="required">*</span><input type="number" min="0" step="0.01" formControlName="invoiceAmount"><small *ngIf="hasError('invoiceAmount','min')">Amount cannot be negative.</small></label><label>Tax amount <span class="required">*</span><input type="number" min="0" step="0.01" formControlName="taxAmount"><small *ngIf="hasError('taxAmount','min')">Tax cannot be negative.</small></label><label>Invoice date <span class="required">*</span><input type="date" formControlName="invoiceDate"><small *ngIf="hasError('invoiceDate','required')">Choose the invoice date.</small></label><label>Due date <span class="optional">(optional)</span><input type="date" formControlName="dueDate"></label><label class="full">Invoice Document URL <span class="optional">(optional)</span><input type="url" formControlName="supportingInvoiceDocument" placeholder="https://example.com/invoice.pdf"><small class="help">Enter a supporting document link. File upload is not available for this backend endpoint.</small></label></div></section><footer><a routerLink="/procurement/invoices" class="btn btn-outline-secondary" [class.disabled]="saving()">Cancel</a><button type="submit" class="btn btn-primary" [disabled]="saving()">{{ saving() ? 'Creating...' : 'Create invoice' }}</button></footer></form></section>
