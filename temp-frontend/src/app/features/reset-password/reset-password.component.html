<section class="auth-shell">
  <div class="auth-card">
    <div class="text-center mb-4">
      <span class="auth-logo">VR</span>
      <h2>Reset password</h2>
      <p>Enter your reset token and choose a new password.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label">Reset token</label>
        <textarea class="form-control" rows="3" formControlName="token"></textarea>
        <div class="field-error" *ngIf="control('token')?.touched && control('token')?.invalid">
          Reset token is required.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">New password</label>
        <input class="form-control" type="password" formControlName="newPassword" autocomplete="new-password" />
        <div class="field-error" *ngIf="control('newPassword')?.touched && control('newPassword')?.invalid">
          Password must be at least 8 characters.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm password</label>
        <input class="form-control" type="password" formControlName="confirmPassword" autocomplete="new-password" />
        <div
          class="field-error"
          *ngIf="control('confirmPassword')?.touched && form.value.newPassword !== form.value.confirmPassword"
        >
          Passwords do not match.
        </div>
      </div>

      <div class="alert alert-danger" *ngIf="errorMessage()">
        {{ errorMessage() }}
      </div>

      <div class="alert alert-success" *ngIf="successMessage()">
        {{ successMessage() }}
      </div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Updating...' : 'Reset password' }}
      </button>
    </form>

    <div class="mt-3 text-center">
      <a routerLink="/login">Back to login</a>
    </div>
  </div>
</section>
