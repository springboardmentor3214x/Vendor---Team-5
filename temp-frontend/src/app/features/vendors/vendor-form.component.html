<section class="page-card">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div>
      <h2 class="mb-1">{{ isEdit() ? 'Edit vendor' : 'Register vendor' }}</h2>
      <p class="mb-0 text-muted">
        {{ isEdit() ? 'Update vendor profile details.' : 'Create a new vendor profile.' }}
      </p>
    </div>
    <a class="btn btn-outline-secondary" routerLink="/vendors">Back to list</a>
  </div>

  <div class="text-muted" *ngIf="loading()">Loading vendor...</div>

  <form *ngIf="!loading()" [formGroup]="form" (ngSubmit)="submit()" class="row g-3" novalidate>
    <div class="col-md-6">
      <label class="form-label">Company name</label>
      <input class="form-control" formControlName="company_name" />
      <div class="text-danger small mt-1" *ngIf="control('company_name')?.touched && control('company_name')?.invalid">
        Company name is required.
      </div>
    </div>

    <div class="col-md-6">
      <label class="form-label">Category</label>
      <select class="form-select" formControlName="vendor_category">
        <option value="">Select category</option>
        <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
      </select>
    </div>

    <div class="col-md-6">
      <label class="form-label">Contact person</label>
      <input class="form-control" formControlName="contact_person_name" />
      <div
        class="text-danger small mt-1"
        *ngIf="control('contact_person_name')?.touched && control('contact_person_name')?.invalid"
      >
        Contact person is required.
      </div>
    </div>

    <div class="col-md-6">
      <label class="form-label">Designation</label>
      <input class="form-control" formControlName="designation" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input class="form-control" type="email" formControlName="email" />
      <div class="text-danger small mt-1" *ngIf="control('email')?.touched && control('email')?.invalid">
        Enter a valid email.
      </div>
    </div>

    <div class="col-md-3">
      <label class="form-label">Phone</label>
      <input class="form-control" formControlName="phone_number" />
      <div class="text-danger small mt-1" *ngIf="control('phone_number')?.touched && control('phone_number')?.invalid">
        Phone is required.
      </div>
    </div>

    <div class="col-md-3">
      <label class="form-label">Alternate phone</label>
      <input class="form-control" formControlName="alternate_phone" />
    </div>

    <div class="col-md-4">
      <label class="form-label">GST number</label>
      <input class="form-control" formControlName="gst_number" />
    </div>

    <div class="col-md-4">
      <label class="form-label">PAN number</label>
      <input class="form-control" formControlName="pan_number" />
    </div>

    <div class="col-md-4">
      <label class="form-label">Registration number</label>
      <input class="form-control" formControlName="company_registration_number" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Address line 1</label>
      <input class="form-control" formControlName="address_line1" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Address line 2</label>
      <input class="form-control" formControlName="address_line2" />
    </div>

    <div class="col-md-3">
      <label class="form-label">City</label>
      <input class="form-control" formControlName="city" />
    </div>

    <div class="col-md-3">
      <label class="form-label">State</label>
      <input class="form-control" formControlName="state" />
    </div>

    <div class="col-md-3">
      <label class="form-label">Country</label>
      <input class="form-control" formControlName="country" />
    </div>

    <div class="col-md-3">
      <label class="form-label">Pincode</label>
      <input class="form-control" formControlName="pincode" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Website</label>
      <input class="form-control" formControlName="website" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Vendor status</label>
      <select class="form-select" formControlName="vendor_status">
        <option *ngFor="let status of statuses" [value]="status">{{ status }}</option>
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label">Bank account number</label>
      <input class="form-control" formControlName="bank_account_number" />
    </div>

    <div class="col-md-4">
      <label class="form-label">IFSC code</label>
      <input class="form-control" formControlName="ifsc_code" />
    </div>

    <div class="col-md-4">
      <label class="form-label">Payment terms</label>
      <input class="form-control" formControlName="payment_terms" />
    </div>

    <div class="col-12">
      <label class="form-label">Description</label>
      <textarea class="form-control" rows="3" formControlName="description"></textarea>
    </div>

    <div class="col-12" *ngIf="errorMessage()">
      <div class="alert alert-danger mb-0">{{ errorMessage() }}</div>
    </div>

    <div class="col-12 action-row pt-2">
      <button class="btn btn-primary" type="submit" [disabled]="saving()">
        {{ saving() ? 'Saving...' : isEdit() ? 'Update vendor' : 'Create vendor' }}
      </button>
      <a class="btn btn-outline-secondary" routerLink="/vendors">Cancel</a>
    </div>
  </form>
</section>
