<section class="page-card">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h2 class="mb-1">Vendors</h2>
      <p class="mb-0 text-muted">Read-only listing aligned to the FastAPI vendors route.</p>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped align-middle" *ngIf="!loading()">
      <thead>
        <tr>
          <th>ID</th>
          <th>Vendor</th>
          <th>Status</th>
          <th>Rating</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let vendor of vendors()">
          <td>{{ vendor.id }}</td>
          <td>{{ vendor.vendor_name }}</td>
          <td><span class="badge text-bg-primary">{{ vendor.status }}</span></td>
          <td>{{ vendor.rating ?? '—' }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="loading()" class="text-muted">Loading vendors...</div>
</section>
