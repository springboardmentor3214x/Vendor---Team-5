<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-badge">VR</span>
      <div>
        <strong>Vendor Reliability</strong>
        <small>Operations Console</small>
      </div>
    </div>

    <nav class="nav-list">
      <a
        *ngFor="let item of visibleNavItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
      >
        {{ item.label }}
      </a>
    </nav>

    <div class="mt-auto">
      <div class="text-white-50 small mb-2" *ngIf="currentUser as user">
        <div>{{ user.fullName }}</div>
        <div>{{ user.role }}</div>
      </div>
      <button class="btn btn-outline-light w-100" type="button" (click)="logout()">
        Logout
      </button>
    </div>
  </aside>

  <section class="content-pane">
    <header class="topbar">
      <div>
        <h1>Vendor Reliability System</h1>
        <p>Authentication, roles, and vendor operations.</p>
      </div>
    </header>

    <main class="page-body">
      <router-outlet></router-outlet>
    </main>
  </section>
</div>
