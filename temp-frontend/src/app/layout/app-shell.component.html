<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div>
        <strong>Vendor Reliability</strong>
        <small>Operations Console</small>
      </div>
    </div>

    <nav class="nav-list">
      <a
        *ngFor="let item of visibleNavItems"
        class="nav-link"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
      >
        {{ item.label }}
      </a>
    </nav>

    <div class="sidebar-footer mt-auto">
      <div class="user-summary" *ngIf="currentUser as user">
        <span class="user-avatar">{{ user.fullName.slice(0, 1) || 'U' }}</span>
        <div>
          <div class="user-name">{{ user.fullName }}</div>
          <div class="user-role">{{ user.role }}</div>
        </div>
      </div>
      <button class="btn btn-outline-light logout-button w-100" type="button" (click)="logout()">
        Logout
      </button>
    </div>
  </aside>

  <section class="content-pane">
    <header class="topbar">
      <div>
        <h1>Vendor Reliability System</h1>
        <p *ngIf="currentUser as user">{{ user.role }} workspace</p>
        <p *ngIf="!currentUser">Authentication, roles, and vendor operations.</p>
      </div>
      <div class="notification-menu" (click)="$event.stopPropagation()" *ngIf="currentUser">
        <button type="button" class="bell-button" (click)="toggleNotifications($event)" aria-label="Open notifications" [attr.aria-expanded]="notificationOpen()">
          <span aria-hidden="true">🔔</span><span class="notification-badge" *ngIf="unreadNotifications()">{{ unreadNotifications() > 99 ? '99+' : unreadNotifications() }}</span>
        </button>
        <section class="notification-dropdown" *ngIf="notificationOpen()" aria-label="Recent notifications">
          <header><strong>Notifications</strong><a routerLink="/notifications" (click)="notificationOpen.set(false)">View all</a></header>
          <button class="recent-notification" type="button" *ngFor="let item of recentNotifications" (click)="openNotification(item)" [class.unread]="!item.isRead"><span class="notification-dot" [class]="'notification-dot ' + item.priority.toLowerCase()"></span><span><b>{{ item.title }}</b><small>{{ item.message }}</small></span></button>
          <p class="empty-notification" *ngIf="!recentNotifications().length">No notifications yet.</p>
        </section>
      </div>
    </header>

    <main class="page-body">
      <router-outlet></router-outlet>
    </main>
  </section>
</div>
